<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Attendee Portal</title>
    <style>
        :root {
            --background: 240 10% 3.9%;
            --foreground: 210 20% 98%;
            --card: 240 10% 10%;
            --card-foreground: 210 20% 98%;
            --border: 240 3.7% 15.9%;
            --muted: 240 3.7% 15.9%;
            --muted-foreground: 240 5% 64.9%;
            --primary: 210 20% 98%;
            --primary-foreground: 240 5.9% 10%;
            --secondary: 240 3.7% 15.9%;
            --secondary-foreground: 210 20% 98%;
            --ring: 240 5% 64.9%;
            --radius: 0.75rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            line-height: 1.5;
            letter-spacing: -0.01em;
        }

        #app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: hsl(var(--background));
            position: relative;
            overflow-x: hidden;
            padding: 0 1rem 2rem;
        }

        .app-header {
            padding: 1.5rem 0.25rem 0.5rem;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: hsl(var(--background));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .app-header .brand {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: hsl(var(--muted-foreground));
            margin-bottom: 0.25rem;
        }
        .app-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: hsl(var(--foreground));
            line-height: 1.2;
        }

        .search-wrap {
            position: relative;
            margin: 1.25rem 0 0.75rem;
            z-index: 5;
        }
        .search-wrap input {
            width: 100%;
            padding: 0.875rem 2.75rem 0.875rem 3rem;
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
            font-size: 0.9375rem;
            font-family: inherit;
            background-color: hsl(var(--card));
            color: hsl(var(--foreground));
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
            outline: none;
        }
        .search-wrap input::placeholder {
            color: hsl(var(--muted-foreground));
            font-weight: 400;
        }
        .search-wrap input:focus {
            border-color: hsl(var(--ring));
            background-color: hsl(var(--secondary));
            box-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 0 0 3px hsla(var(--ring), 0.3);
        }
        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: hsl(var(--muted-foreground));
            display: flex;
            align-items: center;
        }
        .search-clear {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            color: hsl(var(--muted-foreground));
            transition: all 0.2s ease;
        }
        .search-clear.visible {
            display: flex;
        }
        .search-clear:hover {
            background: hsla(var(--muted), 0.8);
            color: hsl(var(--foreground));
        }

        input[type="text"]::-webkit-search-cancel-button,
        input[type="search"]::-webkit-search-cancel-button {
            display: none;
        }
        input[type="text"]::-ms-clear,
        input[type="search"]::-ms-clear {
            display: none;
        }

        .icon-grid-label {
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: hsl(var(--muted-foreground));
            margin: 1.25rem 0 0.75rem 0.25rem;
        }
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .icon-grid .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            transition: transform 0.2s ease;
            text-decoration: none;
            color: inherit;
        }
        .icon-grid .app-icon:active {
            transform: scale(0.94);
        }
        .icon-grid .app-icon .icon-square {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 3.25rem;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid hsl(var(--border));
            background-color: transparent;
            box-shadow: none;
            transition: all 0.2s ease;
            padding: 0.5rem;
            color: hsl(var(--muted-foreground));
        }
        .icon-grid .app-icon:active .icon-square {
            background-color: hsl(var(--muted));
            border-color: hsl(var(--ring));
        }
        .icon-grid .app-icon .icon-square svg {
            stroke: hsl(var(--muted-foreground));
            fill: none;
        }
        .icon-grid .app-icon .icon-label {
            font-size: 0.625rem;
            font-weight: 500;
            color: hsl(var(--muted-foreground));
            text-align: center;
            line-height: 1.2;
            letter-spacing: -0.01em;
            max-width: 4rem;
        }

        .attendee-section-label {
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: hsl(var(--muted-foreground));
            margin: 1.25rem 0 0.75rem 0.25rem;
            display: none;
        }
        .attendee-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .attendee-card {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            padding: 0.875rem 1rem;
            background-color: hsl(var(--card));
            border-radius: var(--radius);
            border: 1px solid hsl(var(--border));
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .attendee-card:hover {
            background-color: hsl(var(--secondary));
            border-color: hsl(var(--ring));
        }
        .attendee-card:active {
            transform: scale(0.985);
            background-color: hsl(var(--muted));
        }
        .attendee-avatar {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            color: hsl(var(--primary-foreground));
            flex-shrink: 0;
            background-color: hsl(var(--primary));
        }
        .attendee-avatar.male {
            background-color: hsl(217 91% 60%);
        }
        .attendee-avatar.female {
            background-color: hsl(340 82% 65%);
        }
        .attendee-info {
            flex: 1;
            min-width: 0;
        }
        .attendee-name {
            font-weight: 600;
            font-size: 0.9375rem;
            color: hsl(var(--foreground));
            letter-spacing: -0.01em;
            line-height: 1.3;
        }
        .attendee-branch-preview {
            font-size: 0.75rem;
            color: hsl(var(--muted-foreground));
            font-weight: 400;
        }
        .attendee-chevron {
            flex-shrink: 0;
            color: hsl(var(--muted-foreground));
            display: flex;
            align-items: center;
            transition: transform 0.2s ease;
        }
        .attendee-card:active .attendee-chevron {
            transform: translateX(3px);
            color: hsl(var(--foreground));
        }

        .no-results {
            text-align: center;
            padding: 2rem 1rem;
            color: hsl(var(--muted-foreground));
            font-weight: 500;
            font-size: 0.9rem;
            display: none;
        }
        .no-results.visible {
            display: block;
        }
        .no-results svg {
            display: block;
            margin: 0 auto 0.75rem;
            opacity: 0.5;
        }

        /* ═══════════════════ DETAIL VIEW – FULL SCREEN ═══════════════════ */
        #detail-view {
            position: fixed;
            inset: 0;
            z-index: 100;
            background-color: hsl(var(--background));
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            /* no max-width, no border-radius, no centering transform */
        }
        #detail-view.active {
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
        }

        .detail-wrapper {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 0 1rem 2.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 0 0.75rem;
            position: sticky;
            top: 0;
            z-index: 5;
            background-color: hsl(var(--background));
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .back-btn {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            border: 1px solid hsl(var(--border));
            background-color: hsl(var(--card));
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: hsl(var(--foreground));
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .back-btn:hover {
            background-color: hsl(var(--secondary));
            border-color: hsl(var(--ring));
        }
        .back-btn:active {
            transform: scale(0.94);
        }
        .detail-header-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: hsl(var(--foreground));
            letter-spacing: -0.02em;
        }

        .detail-card {
            background-color: hsl(var(--card));
            border-radius: var(--radius);
            border: 1px solid hsl(var(--border));
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            padding: 1.25rem 1.125rem;
            margin-top: 0.5rem;
        }
        .detail-avatar-row {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            margin-bottom: 1.25rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid hsl(var(--border));
        }
        .detail-avatar-large {
            width: 3.25rem;
            height: 3.25rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.25rem;
            color: hsl(var(--primary-foreground));
            background-color: hsl(var(--primary));
            flex-shrink: 0;
        }
        .detail-avatar-large.male {
            background-color: hsl(217 91% 60%);
        }
        .detail-avatar-large.female {
            background-color: hsl(340 82% 65%);
        }
        .detail-name-large {
            font-weight: 700;
            font-size: 1.25rem;
            color: hsl(var(--foreground));
            letter-spacing: -0.02em;
            line-height: 1.3;
        }
        .detail-name-sub {
            font-size: 0.75rem;
            color: hsl(var(--muted-foreground));
            font-weight: 400;
        }
        .detail-info-row {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            padding: 0.875rem 0;
            border-bottom: 1px solid hsl(var(--border));
        }
        .detail-info-row:last-child {
            border-bottom: none;
        }
        .detail-info-icon {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background-color: hsl(var(--muted));
            color: hsl(var(--muted-foreground));
        }
        .detail-info-icon svg {
            stroke: currentColor;
            fill: none;
        }
        .detail-info-text {
            flex: 1;
            min-width: 0;
        }
        .detail-info-label {
            font-size: 0.625rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: hsl(var(--muted-foreground));
            margin-bottom: 0.125rem;
        }
        .detail-info-value {
            font-weight: 600;
            font-size: 0.9375rem;
            color: hsl(var(--foreground));
            letter-spacing: -0.01em;
            word-break: break-word;
        }

        @media (min-width: 481px) {
            #app {
                padding: 0 1.5rem 2.5rem;
            }
            .icon-grid {
                gap: 0.75rem;
            }
        }
        @media (min-width: 768px) {
            body {
                align-items: center;
                padding: 1.5rem 0;
            }
            #app {
                border-radius: 1.5rem;
                min-height: auto;
                box-shadow: 0 10px 20px rgba(0,0,0,0.5);
                padding-bottom: 2rem;
            }
            /* No max-width or centering on detail-view – it stays full screen */
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Home View -->
        <div id="home-view">
            <header class="app-header">
                <div class="brand">RLTC LUZON ZONE 2026</div>
                <h1>Attendee Portal</h1>
            </header>

            <div class="search-wrap">
                <span class="search-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </span>
                <input type="text" id="searchInput" placeholder="Search your name…" autocomplete="off" enterkeyhint="search">
                <button class="search-clear" id="searchClear" aria-label="Clear search">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <div class="icon-grid-label">Quick Access</div>
            <div class="icon-grid">

                        </svg>
                    </div>
                    <span class="icon-label">Schedule</span>

                <a class="app-icon" href="https://drive.google.com/file/d/1kmSig5sudcr1lyYfJ9imlqWmh5wu0_4Y/view?cid=ogC5TYq9lBHGdzkP" target="_blank" rel="noopener noreferrer">
                    <div class="icon-square">
                        <svg width="24" height="24" viewBox="0 0 384 512" style="fill:currentColor">
                            <path d="M320 64a64 64 0 1 0 -128 0 64 64 0 1 0 128 0zM200.7 264l22.9 31.5c6.5 8.9 16.3 14.7 27.2 16.1s21.9-1.7 30.4-8.7l88-72c17.1-14 19.6-39.2 5.6-56.3s-39.2-19.6-56.3-5.6l-55.2 45.2-26.2-36c-15.6-21.5-40.6-34.2-67.2-34.2-30.9 0-59.2 17.1-73.6 44.4L47.8 280.9c-20.2 38.5-9.4 85.9 25.6 111.8L126.6 432 40 432c-22.1 0-40 17.9-40 40s17.9 40 40 40l208 0c17.3 0 32.6-11.1 38-27.5s-.3-34.4-14.2-44.7l-116.1-85.8 45-90z"/>
                        </svg>
                    </div>
                    <span class="icon-label">Prayer<br>Guide</span>
                </a>
                <a class="app-icon" href="https://forms.gle/DeHSh2agaHMnpgjPA" target="_blank" rel="noopener noreferrer">
                    <div class="icon-square">
                        <svg width="24" height="24" viewBox="0 0 512 512" style="fill:currentColor">
                            <path d="M256 480c141.4 0 256-107.5 256-240S397.4 0 256 0 0 107.5 0 240c0 54.3 19.2 104.3 51.6 144.5L2.8 476.8c-4.8 9-3.3 20 3.6 27.5s17.8 9.8 27.1 5.8l118.4-50.7C183.7 472.6 218.9 480 256 480zM128 208a32 32 0 1 1 0 64 32 32 0 1 1 0-64zm128 0a32 32 0 1 1 0 64 32 32 0 1 1 0-64zm96 32a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z"/>
                        </svg>
                    </div>
                    <span class="icon-label">Evaluation</span>
                </a>
                <a class="app-icon" href="#" target="_blank" rel="noopener noreferrer">

            </div>

            <div class="attendee-section-label" id="attendeeLabel">Attendees</div>
            <div class="attendee-list" id="attendeeList"></div>
            <div class="no-results" id="noResults">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    <line x1="8" y1="11" x2="14" y2="11"/>
                </svg>
                No attendees found
            </div>
        </div>

        <!-- Detail View – full screen, content centered -->
        <div id="detail-view">
            <div class="detail-wrapper">
                <div class="detail-header">
                    <button class="back-btn" id="backBtn" aria-label="Go back">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15,18 9,12 15,6"/>
                        </svg>
                    </button>
                    <span class="detail-header-title">Attendee Info</span>
                </div>
                <div class="detail-card">
                    <div class="detail-avatar-row">
                        <div class="detail-avatar-large" id="detailAvatar">?</div>
                        <div>
                            <div class="detail-name-large" id="detailName">—</div>
                            <div class="detail-name-sub">Conference Attendee</div>
                        </div>
                    </div>
                    <div class="detail-info-row">
                        <div class="detail-info-icon">
                            <svg width="20" height="20" viewBox="0 0 448 512" style="fill:currentColor;stroke:none">
                                <path d="M224 248a120 120 0 1 0 0-240 120 120 0 1 0 0 240zm-29.7 56C95.8 304 16 383.8 16 482.3 16 498.7 29.3 512 45.7 512l356.6 0c16.4 0 29.7-13.3 29.7-29.7 0-98.5-79.8-178.3-178.3-178.3l-59.4 0z"/>
                            </svg>
                        </div>
                        <div class="detail-info-text">
                            <div class="detail-info-label">Full Name</div>
                            <div class="detail-info-value" id="detailFullName">—</div>
                        </div>
                    </div>
                    <div class="detail-info-row">

    <script src="attendees.js"></script>
    <script>
        (function() {
            let attendees = [];
            const searchInput = document.getElementById('searchInput');
            const searchClear = document.getElementById('searchClear');
            const attendeeList = document.getElementById('attendeeList');
            const noResults = document.getElementById('noResults');
            const attendeeLabel = document.getElementById('attendeeLabel');
            const detailView = document.getElementById('detail-view');
            const backBtn = document.getElementById('backBtn');

            // Detail elements
            const detailAvatar = document.getElementById('detailAvatar');
            const detailName = document.getElementById('detailName');
            const detailFullName = document.getElementById('detailFullName');
            const detailBranch = document.getElementById('detailBranch');
            const detailRoom = document.getElementById('detailRoom');
            const detailTracks = document.getElementById('detailTracks');
            const detailBus = document.getElementById('detailBus');
            const detailOuting = document.getElementById('detailOuting');

            function parseCSV(text) {
                const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
                if (lines.length < 2) return [];
                const headers = lines[0].split(',').map(h => h.trim());
                const nameIdx = headers.indexOf('Name');
                const genderIdx = headers.indexOf('Gender');
                const branchIdx = headers.indexOf('Branch');
                const roomIdx = headers.indexOf('Room Number');
                const busIdx = headers.indexOf('Bus Number');
                const outingIdx = headers.indexOf('Outing Group');
                const t1Idx = headers.indexOf('T1');
                const t2Idx = headers.indexOf('T2');
                const t3Idx = headers.indexOf('T3');
                const t4Idx = headers.indexOf('T4');
                const t5Idx = headers.indexOf('T5');

                const result = [];
                for (let i = 1; i < lines.length; i++) {
                    const cols = lines[i].split(',').map(c => c.trim());
                    let gender = 'male';
                    const rawGender = (genderIdx !== -1) ? cols[genderIdx].toUpperCase() : '';
                    if (rawGender === 'F') gender = 'female';
                    const tracksArr = [];
                    [t1Idx, t2Idx, t3Idx, t4Idx, t5Idx].forEach(idx => {
                        if (idx !== -1 && cols[idx] && cols[idx].trim() !== '') tracksArr.push(cols[idx].trim());
                    });
                    result.push({
                        id: i,
                        name: nameIdx !== -1 ? cols[nameIdx] : '',
                        gender,
                        branch: branchIdx !== -1 ? cols[branchIdx] : '',
                        room: roomIdx !== -1 ? cols[roomIdx] : '',
                        bus: busIdx !== -1 ? cols[busIdx] : '',
                        outingGroup: outingIdx !== -1 ? cols[outingIdx] : '',
                        tracks: tracksArr.join(', ')
                    });
                }
                return result;
            }

            function loadAttendees() {
                if (typeof CSV_DATA !== 'undefined') {
                    attendees = parseCSV(CSV_DATA);
                }
                renderAttendeeList('');
                searchInput.focus();
            }

            function renderAttendeeList(filterText = '') {
                const query = filterText.trim().toLowerCase();
                if (query === '') {
                    attendeeList.innerHTML = '';
                    noResults.classList.remove('visible');
                    attendeeLabel.style.display = 'none';
                    return;
                }
                attendeeLabel.style.display = 'block';
                const filtered = attendees.filter(a => a.name.toLowerCase().includes(query));
                attendeeList.innerHTML = '';
                if (filtered.length === 0) {
                    noResults.classList.add('visible');
                } else {
                    noResults.classList.remove('visible');
                    filtered.forEach(att => {
                        const card = document.createElement('div');
                        card.className = 'attendee-card';
                        card.setAttribute('data-id', att.id);
                        card.setAttribute('role', 'button');
                        card.setAttribute('tabindex', '0');
                        card.setAttribute('aria-label', `View details for ${att.name}`);
                        const initial = att.name.charAt(0);
                        const avatarClass = att.gender === 'female' ? 'female' : 'male';
                        card.innerHTML = `
                            <div class="attendee-avatar ${avatarClass}">${initial}</div>
                            <div class="attendee-info">
                                <div class="attendee-name">${escapeHTML(att.name)}</div>
                                <div class="attendee-branch-preview">${escapeHTML(att.branch)}</div>
                            </div>
                            <div class="attendee-chevron">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="9,18 15,12 9,6"/>
                                </svg>
                            </div>
                        `;
                        card.addEventListener('click', () => openDetail(att));
                        card.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                openDetail(att);
                            }
                        });
                        attendeeList.appendChild(card);
                    });
                }
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function openDetail(att) {
                const initial = att.name.charAt(0);
                const avatarClass = att.gender === 'female' ? 'female' : 'male';
                detailAvatar.textContent = initial;
                detailAvatar.className = 'detail-avatar-large ' + avatarClass;
                detailName.textContent = att.name;
                detailFullName.textContent = att.name;
                detailBranch.textContent = att.branch;
                detailRoom.textContent = att.room;
                detailTracks.textContent = att.tracks;
                detailBus.textContent = att.bus;
                detailOuting.textContent = att.outingGroup;

                detailView.classList.add('active');
                document.body.style.overflow = 'hidden';
                detailView.scrollTop = 0;
                setTimeout(() => backBtn.focus(), 100);
            }

            function closeDetail() {
                detailView.classList.remove('active');
                document.body.style.overflow = '';
                searchInput.focus();
            }

            searchInput.addEventListener('input', function() {
                searchClear.classList.toggle('visible', this.value.trim().length > 0);
                renderAttendeeList(this.value);
            });
            searchClear.addEventListener('click', () => {
                searchInput.value = '';
                searchClear.classList.remove('visible');
                renderAttendeeList('');
                searchInput.focus();
            });
            backBtn.addEventListener('click', closeDetail);
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && detailView.classList.contains('active')) {
                    closeDetail();
                }
            });

            loadAttendees();
        })();
    </script>
